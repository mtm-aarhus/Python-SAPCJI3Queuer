[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_framework"
version = "0.0.1"
authors = [
  { name="ITK Development", email="itk-rpa@mkb.aarhus.dk" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
# Deliberately lighter than the dispatcher and performer: this robot drives no
# browser, no SAP GUI and no database, so selenium, pywin32, psutil and pyodbc are
# all unnecessary. Pillow stays because error_screenshot.py uses PIL.ImageGrab.
dependencies = [
    "OpenOrchestrator == 3.*",
    "Pillow == 10.*"
]

# Without this, setuptools uses flat-layout auto-discovery and treats EVERY top-level
# directory as a candidate package, then refuses to build if it finds more than one.
# That breaks `uv run python -m robot_framework` - the robot itself, not just tooling -
# the moment a second directory appears next to robot_framework. Naming the package
# removes the guesswork. (It happened in the performer repo when sql/ was added.)
[tool.setuptools]
packages = ["robot_framework"]

[project.optional-dependencies]
dev = [
  "pylint",
  "flake8"
]
